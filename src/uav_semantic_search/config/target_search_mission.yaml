  uav0:
    - {x: 2.0,  y: -0.70, z: 1.80, yaw_deg: 0.0}
    - {x: 8.0,  y: -0.70, z: 1.80, yaw_deg: 0.0}
    - {x: 14.0, y: -0.70, z: 1.80, yaw_deg: 0.0}
    - {x: 20.0, y: -0.70, z: 1.80, yaw_deg: 0.0}
    - {x: 27.0, y: -0.70, z: 1.80, yaw_deg: 0.0}
  uav1:
    - {x: 2.0,  y: 0.70, z: 2.20, yaw_deg: 0.0}
    - {x: 12.0, y: 0.70, z: 2.20, yaw_deg: 0.0}
    - {x: 22.8, y: 0.70, z: 2.20, yaw_deg: 0.0}
    - {x: 24.8, y: 1.10, z: 2.20, yaw_deg: 1.5708}
    - {x: 24.8, y: 3.40, z: 2.20, yaw_deg: 1.5708}
