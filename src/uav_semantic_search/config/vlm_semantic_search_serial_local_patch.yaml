# Stage-5 v0.5.6 serial local-VLM dispatch settings.
# Apply with scripts/upgrade_stage5_v056_serial_local_config.py.  Do not copy
# this file over vlm_semantic_search.yaml because your YAML may contain a direct
# API key.
vlm_semantic_search:
  pause_gazebo_during_epoch: false
  # Keep the coordinator wait longer than the HTTP request timeout.
  local_response_timeout_sec: 50.0
  central_response_timeout_sec: 50.0
  validator_timeout_sec: 6.0
  skip_central_on_local_timeout: true
  skip_central_on_local_failure: true
  local_dispatch:
    # serial prevents three RGB requests from being queued concurrently by one
    # cloud API key/model endpoint.
    mode: sequential
    participant_order: [uav0, uav1, ugv0]
    per_robot_response_timeout_sec: 50.0
    inter_request_delay_sec: 0.30
  scheduler:
    min_trigger_interval_sec: 20.0
    backend_failure_cooldown_sec: 60.0
    trigger_on_goal_reached: true
    trigger_on_robot_blocked: true
    trigger_on_target_query_change: true
    trigger_on_distance_in_uncertain_space: false
    trigger_on_new_observation_sector: false
    trigger_on_visual_novelty: false
    trigger_on_map_free_space_expanded: false
    trigger_on_topology_cue_changed: false
