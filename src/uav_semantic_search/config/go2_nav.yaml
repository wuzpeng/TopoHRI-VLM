ground_robots:
- name: ugv0
  type: ugv
  gazebo_model: go2_0
  global_pose_topic: /ugv0/global_pose
  lidar_topic: /ugv0/lidar/points
  rgb_topic: /ugv0/front_camera/rgb/image_raw
  depth_topic: /ugv0/front_camera/depth/image_raw
  camera_info_topic: /ugv0/front_camera/rgb/camera_info
  mission_goal_topic: /ugv0/mission/goal
  cmd_vel_topic: /ugv0/cmd_vel
  mission_reached_topic: /ugv0/mission/reached
  blocked_topic: /ugv0/safety/blocked
  planned_path_topic: /ugv0/search/planned_path
  ground_map_topic: /ugv0/ground_map_2d
  spawn:
    x: 0.8
    y: 0.0
    z: 0.34
    yaw: 0.0
  base_height_m: 0.34
  lidar_xyz:
  - 0.18
  - 0.0
  - 0.28
  lidar_rpy:
  - 0.0
  - 0.0
  - 0.0
  official_front_camera_link: front_camera
  camera_xyz:
  - 0.32715
  - -3.0e-05
  - 0.04297
  camera_optical_to_body_rpy:
  - -1.57079632679
  - 0.0
  - -1.57079632679
  rgbd:
    update_rate_hz: 15.0
    width: 640
    height: 480
    horizontal_fov_rad: 1.3962634
    near_clip_m: 0.25
    far_clip_m: 8.0
    baseline_m: 0.07
  navigation:
    body_radius_m: 0.34
    safety_margin_m: 0.18
    max_linear_speed_mps: 0.60
    max_angular_speed_rps: 0.90
    goal_tolerance_m: 0.25
    heading_tolerance_rad: 0.28
    rotate_before_move_rad: 0.42
    linear_gain: 0.65
    angular_gain: 1.3
    command_timeout_sec: 0.6
    front_stop_distance_m: 0.52
    front_half_width_m: 0.27
    lidar_ground_reject_z_m: -0.62
    lidar_floor_margin_m: 0.08
    front_block_confirm_frames: 3
    front_clear_confirm_frames: 3
    blocked_escape_heading_rad: 0.25
  lidar_frame_id: ugv0/lidar_link
  camera_optical_frame_id: ugv0/camera_optical_frame
ground_map:
  frame_id: map
  resolution: 0.2
  width: 220
  height: 140
  origin_x: -6.0
  origin_y: -14.0

  obstacle_z_min: 0.12
  obstacle_z_max: 0.78
  lidar_max_range: 12.0
  max_range_no_hit_margin: 0.20

  point_stride: 1
  publish_rate: 2.0

  free_increment: 1
  occupied_increment: 4
  free_clear_increment: 1
  max_evidence: 100
  occupied_ratio: 0.75

  # 过滤雷达原点附近的车体、腿部和安装结构回波
  robot_body_filter_radius: 0.65

  free_increment: 1
  occupied_increment: 4
  free_clear_increment: 1
  max_evidence: 100
  occupied_ratio: 0.75
heterogeneous_fuel:
  manager_tick_hz: 2.0
  replan_period_sec: 3.0
  mission_goal_timeout_sec: 70.0
  stop_on_confirmed_target: true
  uav_map_topic: /global_map_2d
  uav_map_bootstrap_known_cells: 120
  post_takeoff_map_bootstrap_sec: 6.0
  ugv_wait_for_uav_takeoff: true
  ugv_post_uav_takeoff_delay_sec: 0.0
  ugv_initial_scan_sec: 6.0
  ugv_map_bootstrap_known_cells: 600
  ground_exploration_boundary:
    x_min: 0.2
    x_max: 34.8
    y_min: -6.8
    y_max: 6.8
    margin_m: 0.2
  ugv_obstacle_inflation_m: 0.54
  ugv_min_clearance_m: 0.52
  ugv_min_frontier_length_m: 0.6
  ugv_gain_radius_m: 2.2
  ugv_frontier_sample_stride: 1
  ugv_hgrid_size_m: 3.0
  ugv_max_assignment_path_m: 24.0
  ugv_nearest_free_search_cells: 20
  ugv_astar_max_expansions: 30000
  ugv_persistent_block_replan_sec: 2.5
  ugv_gain_weight: 0.055
  ugv_frontier_weight: 1.0
  ugv_path_cost_weight: 1.0
  ugv_risk_weight: 7.0
  ugv_revisit_radius_m: 1.2
  ugv_revisit_penalty: 4.0
  marker_z_uav_m: 0.25
  marker_z_ugv_m: 0.18
